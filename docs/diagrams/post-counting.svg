<rect x="316.2" y="228.2" width="27.7" height="23.5" rx="5" fill="#ffffff"/>
<text x="330.0" y="240.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#495057">no</text>
<path d="M450.0,315.0 L550.0,315.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="482.2" y="303.2" width="35.5" height="23.5" rx="5" fill="#ffffff"/>
<text x="500.0" y="315.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#495057">yes</text>
<path d="M330.0,370.0 L330.0,410.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="316.2" y="378.2" width="27.7" height="23.5" rx="5" fill="#ffffff"/>
<text x="330.0" y="390.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#495057">no</text>
<path d="M450.0,465.0 L550.0,465.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="482.2" y="453.2" width="35.5" height="23.5" rx="5" fill="#ffffff"/>
<text x="500.0" y="465.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#495057">yes</text>
<path d="M330.0,520.0 L330.0,560.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="316.2" y="528.2" width="27.7" height="23.5" rx="5" fill="#ffffff"/>
<text x="330.0" y="540.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#495057">no</text>
<path d="M330.0,640.0 L330.0,680.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="265.2" y="648.2" width="129.6" height="23.5" rx="5" fill="#ffffff"/>
<text x="330.0" y="660.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#495057">≥ 50% on screen</text>
<path d="M450.0,735.0 L550.0,735.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="482.2" y="723.2" width="35.5" height="23.5" rx="5" fill="#ffffff"/>
<text x="500.0" y="735.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#495057">yes</text>
<path d="M330.0,790.0 L330.0,830.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="316.2" y="798.2" width="27.7" height="23.5" rx="5" fill="#ffffff"/>
<text x="330.0" y="810.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#495057">no</text>
</g></svg>
