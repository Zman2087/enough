<svg xmlns="http://www.w3.org/2000/svg" width="700" height="1056" viewBox="0 0 700 1056" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#1e1e1e" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="22" font-weight="600" text-anchor="start" dominant-baseline="central" fill="#1e1e1e">How a post is counted (or not)</text>
<g transform="translate(-150.0,96.0)">
<rect x="190" y="0" width="280" height="70" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="330.0" y="25.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">A post enters the page</text>
<text x="330.0" y="45.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(MutationObserver)</text>
<polygon points="330.0,110 450,165.0 330.0,220 210,165.0" fill="#ffec99" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
<text x="330.0" y="147.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Ad?</text>
<text x="330.0" y="165.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">"Ad" / "Sponsored" label</text>
<text x="330.0" y="182.5" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">or ad tracking link</text>
<rect x="550" y="125" width="260" height="80" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="680.0" y="155.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Keep visible, never count</text>
<text x="680.0" y="175.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(Personal build: collapse it)</text>
<polygon points="330.0,260 450,315.0 330.0,370 210,315.0" fill="#ffec99" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
<text x="330.0" y="297.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Suggested?</text>
<text x="330.0" y="315.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">has its own Follow button,</text>
<text x="330.0" y="332.5" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">or a Reel</text>
<rect x="550" y="275" width="260" height="80" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="680.0" y="305.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Hide it</text>
<text x="680.0" y="325.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(not counted)</text>
<polygon points="330.0,410 450,465.0 330.0,520 210,465.0" fill="#ffec99" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
<text x="330.0" y="447.5" font-size="14" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Seen earlier today?</text>
<text x="330.0" y="465.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">shortcode in the</text>
<text x="330.0" y="482.5" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">App Group list</text>
<rect x="550" y="425" width="260" height="80" rx="10" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="680.0" y="455.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Collapse it</text>
<text x="680.0" y="475.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(counted already)</text>
<rect x="190" y="560" width="280" height="80" rx="10" fill="#a5d8ff" stroke="#1e1e1e" stroke-width="2"/>
<text x="330.0" y="590.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Watch it</text>
<text x="330.0" y="610.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">IntersectionObserver, 50% visible</text>
<polygon points="330.0,680 450,735.0 330.0,790 210,735.0" fill="#ffec99" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round"/>
<text x="330.0" y="735.0" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Cap reached?</text>
<rect x="550" y="695" width="260" height="80" rx="10" fill="#e9ecef" stroke="#1e1e1e" stroke-width="2"/>
<text x="680.0" y="725.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Do nothing</text>
<text x="680.0" y="745.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(the count stops at the cap)</text>
<rect x="190" y="830" width="280" height="90" rx="10" fill="#b2f2bb" stroke="#1e1e1e" stroke-width="2"/>
<text x="330.0" y="855.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">Count it once</text>
<text x="330.0" y="875.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">postViewed(permalink) →</text>
<text x="330.0" y="895.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">UsageStore.record</text>
<path d="M330.0,70.0 L330.0,110.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M450.0,165.0 L550.0,165.0" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="482.2" y="153.2" width="35.5" height="23.5" rx="5" fill="#ffffff"/>
<text x="500.0" y="165.0" font-size="14" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#495057">yes</text>
