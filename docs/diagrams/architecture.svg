<text x="140.0" y="515.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">main frame:</text>
<text x="140.0" y="533.8" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">instagram.com only</text>
<rect x="240" y="460" width="160" height="110" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="320.0" y="496.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">CapPolicy</text>
<text x="320.0" y="515.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">which pages</text>
<text x="320.0" y="533.8" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">the cap blocks</text>
<rect x="420" y="460" width="160" height="110" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="500.0" y="496.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">UsageStore</text>
<text x="500.0" y="515.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">DayBoundary</text>
<text x="500.0" y="533.8" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">count + reset</text>
<rect x="600" y="460" width="170" height="110" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="685.0" y="496.2" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">SelectorValidator</text>
<text x="685.0" y="515.0" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">remote rules are</text>
<text x="685.0" y="533.8" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">data, never script</text>
<rect x="830" y="440" width="320" height="140" rx="10" fill="#d0bfff" stroke="#1e1e1e" stroke-width="2"/>
