<text x="290.0" y="292.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">WKWebView + message bridge</text>
<text x="290.0" y="312.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">loads instagram.com only, injects the</text>
<text x="290.0" y="332.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">bundled script, receives page messages</text>
