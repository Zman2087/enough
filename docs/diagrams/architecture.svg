<text x="990.0" y="520.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">today's post shortcodes</text>
<text x="990.0" y="540.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">(deleted at the reset time)</text>
