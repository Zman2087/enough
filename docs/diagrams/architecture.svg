<text x="750.0" y="155.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">bundled in the app,</text>
<text x="750.0" y="175.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">never downloaded</text>
<rect x="890" y="100" width="230" height="110" rx="10" fill="#ffffff" stroke="#1e1e1e" stroke-width="2"/>
<text x="1005.0" y="126.9" font-size="15" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">What it does</text>
<text x="1005.0" y="145.6" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">hides Reels, suggestions</text>
<text x="1005.0" y="164.4" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">collapses seen posts</text>
<text x="1005.0" y="183.1" font-size="15" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">keeps ads visible</text>
<rect x="630" y="240" width="490" height="110" rx="10" fill="#ffc9c9" stroke="#1e1e1e" stroke-width="2"/>
<text x="875.0" y="275.0" font-size="16" font-weight="600" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">instagram.com (mobile site)</text>
<text x="875.0" y="295.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">you sign in on Meta's own page;</text>
<text x="875.0" y="315.0" font-size="16" font-weight="normal" text-anchor="middle" dominant-baseline="central" fill="#1e1e1e">the app never sees the password</text>
